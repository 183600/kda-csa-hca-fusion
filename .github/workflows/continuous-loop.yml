name: Continuous Loop

on:
  workflow_dispatch:
  # 每 15 分钟一次「心跳」+ 下面 concurrency 排队，保证「一个 job 结束后立刻触发下一个」：
  # 任何时刻组内最多 1 个 running + 1 个 pending；当前 run 无论以何种方式结束
  # （成功 / 失败 / 被取消 / runner 意外宕机），队列中的下一个 run 都会在几秒内开始。
  # 即使收尾的 self-dispatch 步骤被 GitHub 跳过（runner 宕机时连 if: always()
  # 步骤也不会执行），下一次心跳也能在 ≤15 分钟内补位续跑，链条永不断。
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: continuous-loop
  cancel-in-progress: false

jobs:
  run-opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: write
      actions: write

    steps:
      # ⭐ 立刻续跑（上）：本 run 一开始就把「下一个 run」排进 concurrency 队列。
      # concurrency.cancel-in-progress=false → 组内 1 running + 1 pending，
      # 本 run 无论以何种方式结束（成功 / 失败 / 超时被取消 / runner 宕机），
      # 队列里的后继 run 都会在几秒内自动开始；不依赖任何收尾步骤是否被执行。
      - name: Queue next run (immediate hand-off)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME}"
          WF_REF="${GITHUB_WORKFLOW_REF%%@*}"
          WF_FILE="${WF_REF##*/}"
          case "$WF_FILE" in
            *.yml|*.yaml) ;;
            *) WF_FILE="continuous-loop.yml" ;;
          esac
          echo "[loop] repo=${GH_REPO} workflow=${WF_FILE} branch=${BRANCH} run=${RUN_ID}"
          # 组内是否已有「另一个」排队中的 run（排除当前 run 自己：
          # 它刚启动时 API 状态可能还是 pending，不能当成后继）
          pending_other() {
            gh api "repos/${GH_REPO}/actions/workflows/${WF_FILE}/runs?per_page=30" \
              --jq '[.workflow_runs[] | select((.id|tostring) != "'"${RUN_ID}"'") | select(.status=="pending" or .status=="queued" or .status=="waiting" or .status=="requested")] | length' \
              2>/dev/null
          }
          Q="$(pending_other)"
          # 查询失败时按 0 处理：宁可多派一个（会被队列合并），也绝不能漏派而断链
          case "$Q" in ''|*[!0-9]*) Q=0 ;; esac
          echo "[loop] queued successors before dispatch: ${Q}"
          if [ "$Q" != "0" ]; then
            echo "[loop] 后继 run 已在队列中，无需重复派发"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if gh workflow run "$WF_FILE" --ref "$BRANCH"; then
              for _ in 1 2 3 4 5 6; do
                sleep 5
                Q="$(pending_other)"
                case "$Q" in ''|*[!0-9]*) Q=0 ;; esac
                if [ "$Q" != "0" ]; then
                  echo "[loop] 后继 run 已排队（attempt ${attempt}）——当前 run 一结束它就会立刻起跑"
                  exit 0
                fi
              done
              echo "[loop][warn] 派发已提交但暂未看到排队的 run（attempt ${attempt}）"
            else
              echo "[loop][warn] 派发失败（attempt ${attempt}）"
            fi
            sleep 10
          done
          echo "[loop][warn] 未能确认后继 run；收尾的 next-run job 与 */15 心跳会补位"
          exit 0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free up disk space (keep miniconda)
        run: |
          set +e
          echo "=== disk before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/share/swift \
                      /usr/local/lib/android \
                      /usr/local/share/boost \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          echo "=== disk after cleanup ==="
          df -h /

      # Python 项目：pip 依赖缓存 + 固定版本的 CI 依赖文件（requirements-ci.txt）。
      # cache-dependency-path 里只列仓库中真实存在的依赖文件。
      - name: Setup Python (pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements-ci.txt
            requirements.txt
            pyproject.toml

      # npm 全局包缓存：本仓库没有 package-lock.json，无法用 setup-node 的 `cache: npm`
      # （它要求 lock 文件存在），因此直接缓存 ~/.npm，`npm i -g opencode-ai` 会复用其中的 tarball。
      - name: Cache npm (opencode-ai tarballs)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-opencode-${{ hashFiles('.github/workflows/continuous-loop.yml') }}
          restore-keys: |
            ${{ runner.os }}-npm-opencode-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 预热 pip 缓存：命中时后续依赖安装直接复用 wheel。失败不致命（`|| echo`）。
      # 版本以仓库 requirements.txt / pyproject.toml 为准；首次接入请人工核对
      # requirements-ci.txt 与仓库真实依赖一致。
      - name: Warm pip cache from requirements-ci.txt
        run: |
          set +e
          python3 -m pip install -r requirements-ci.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            || echo "[warn] requirements-ci.txt 预热失败（非致命），后续步骤会按原方式安装依赖"

      - name: Setup Python and test dependencies (gate)
        run: |
          set +e
          python3 --version
          python3 -m pip install --quiet --upgrade pip 2>/dev/null || true
          # ci_gate.py 的 pytest 层需要：torch(CPU)+einops+numpy+matplotlib+pytest
          if python3 -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu; then
            echo "[ok] CPU torch installed for the gate checks"
          elif python3 -m pip install --quiet torch; then
            echo "[ok] torch installed (default index)"
          else
            echo "[warn] torch install failed; gate degrades to syntax checks only"
          fi
          python3 -m pip install --quiet einops numpy matplotlib pytest 2>/dev/null \
            || echo "[warn] einops/numpy/matplotlib/pytest install failed; gate degrades further"
          python3 -c "import torch, einops, numpy, matplotlib, pytest; print('deps OK')" 2>/dev/null \
            || echo "[warn] gate dependencies incomplete"

      - name: Configure swap (safe version)
        run: |
          set -e
          echo "=== Before ==="
          free -h
          df -h /

          sudo systemctl disable --now systemd-oomd.socket systemd-oomd.service 2>/dev/null || true

          sudo modprobe zram 2>/dev/null || true
          if [ -e /dev/zram0 ]; then
            sudo swapoff /dev/zram0 2>/dev/null || true
            echo 8G | sudo tee /sys/block/zram0/disksize >/dev/null || true
            sudo mkswap /dev/zram0 >/dev/null 2>&1 || true
            sudo swapon -p 100 /dev/zram0 2>/dev/null && echo "[ok] zram enabled (8G, prio=100)" \
              || echo "[warn] zram enable failed"
          else
            echo "[info] zram not available, skip"
          fi

          AVAIL_KB=$(df --output=avail / | tail -1)
          AVAIL_MB=$((AVAIL_KB / 1024))
          WANT_MB=$((AVAIL_MB - 3072))
          if [ "$WANT_MB" -gt 8192 ]; then WANT_MB=8192; fi
          if [ "$WANT_MB" -lt 2048 ]; then WANT_MB=2048; fi
          echo "[info] available disk: ${AVAIL_MB}MB, will create swapfile: ${WANT_MB}MB"

          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          if ! sudo fallocate -l "${WANT_MB}M" /swapfile 2>/dev/null; then
            echo "[info] fallocate failed, falling back to dd"
            sudo dd if=/dev/zero of=/swapfile bs=1M count=$WANT_MB status=none
          fi
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon -p 10 /swapfile && echo "[ok] swapfile enabled"

          sudo sysctl -w vm.swappiness=100
          sudo sysctl -w vm.vfs_cache_pressure=200
          sudo sysctl -w vm.overcommit_memory=1
          sudo sysctl -w vm.dirty_ratio=40
          sudo sysctl -w vm.dirty_background_ratio=10
          sudo sysctl -w vm.watermark_scale_factor=200 2>/dev/null || true

          echo "=== After ==="
          free -h
          swapon --show
          df -h /

      - name: Install DeepSeek Harness (dsh)
        run: |
          npm i -g @deepseek-ai/dsh@0.2.1-rc.2
          dsh --version

      - name: Configure dsh (DeepSeek official API)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -e
          [ -n "$DEEPSEEK_API_KEY" ] || { echo "[error] secrets.DEEPSEEK_API_KEY 未配置" >&2; exit 1; }
          echo "[info] dsh $(dsh --version) | provider=deepseek-official | model=deepseek-flash"

      - name: Install xuen (drives the improve phase)
        run: |
          set -e
          # xuen：随机灵感词 × 外部 agent（opencode）模拟人类研究者的改进循环。
          # 公共仓库，匿名克隆即可；工作区放在 /tmp（不进仓库、整个 job 内跨阶段复用，
          # 词库/研究状态在同一 job 的多个 improve 阶段之间共享）。
          git clone --depth 1 https://github.com/183600/xuen.git /tmp/xuen
          python3 -m pip install --quiet -r /tmp/xuen/requirements.txt
          mkdir -p /tmp/xuen-workspace
          python3 /tmp/xuen/main.py --help >/dev/null
          echo "[ok] xuen ready at /tmp/xuen (workspace: /tmp/xuen-workspace)"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: "Run dsh for ~3 hours (bug / sci / improve-via-xuen; perf/clean disabled)"
        timeout-minutes: 180
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          set -o pipefail
          BRANCH="${GITHUB_REF_NAME:-master}"
          OUT=/tmp/oc_out.log
          # 单次 run 的硬预算：3 小时（step 上限 180 分钟，job 上限 200 分钟，
          # 这里留 10 分钟给收尾的清理 / 最终提交 / 推送）
          RUN_HOURS=3
          DEADLINE=$(( $(date +%s) + RUN_HOURS*3600 - 600 ))

          # ================= 五阶段提示词（improve 阶段由 xuen 驱动） =================
          PROMPT_PERF='优化代码的性能和内存占用，但必须保持参考实现的语义不变：ops_*.py 中所有算子的数值行为（chunk/recurrent 等价性、因果掩码、dtype 处理、边界情况）必须与现有实现完全一致，run_correctness.py 的全量对拍测试必须持续通过；不得引入新的外部依赖（如 Triton/FLA/CUDA kernel）——本仓库是 CPU 优先的正确性参考实现与实验框架；不得改动公共接口（函数签名、HybridConfig 默认值、各 run_*.py 脚本的命令行参数）。性能优化只能在上述约束内进行（内存布局、分块、向量化、缓存、原地操作等）。每次改动后运行 python3 ci_gate.py 自检（含全量 pytest 对拍），不通过就自己修好。不要输出或写入"优化了哪些内容"的报告。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；LICENSE、README.md、ci_gate.py、conftest.py、run_correctness.py、test_figures.py 和 results_lm/ 目录同样绝对不能删除、修改或移动。'
          PROMPT_BUG='仔细检查代码中是否存在bug，如果有就修改代码。修复必须保持参考实现的数值语义不变，不得借修复之名做无意义的等价重写；不得削弱或删除 run_correctness.py / test_figures.py 中的对拍测试。每次修复后运行 python3 ci_gate.py 确认通过。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；LICENSE、README.md、ci_gate.py、conftest.py、run_correctness.py、test_figures.py 和 results_lm/ 目录同样绝对不能删除、修改或移动。'

          # ================= 科研方法改进阶段（sci）：提示词池，每次运行时随机选一个 =================
          # SCI_1 为通用提示词：只要求改进科研方法，不指定改进哪一方面；
          # SCI_2~SCI_6 各自只聚焦一个方面：实验设计与准备 / 数据处理 / 可复现性与工程规范 / 对比实验与消融 / 结果分析。
          PROMPT_SCI_1='改进这个项目的科研方法。本项目是 KDA/Mamba-2/CSA/HCA 混合线性注意力栈（默认 3:1:1 配比）的正确性优先参考实现：数值契约（因果性、dtype 边界、空序列、attention sink 稳定性、跨 decode 步状态管理）优先于速度；latency 数字只代表朴素参考实现，绝不能与 FLA/FlashAttention/DeepSeek 生产 kernel 比较。方法学锚点是 docs/ 下的方法学文档（flops-accounting、kv-budget-model、ppl-calibration、equivalence-testing、decode-state-ablation、recall-flops-audit 等）与 run_correctness.py 对拍套件；改进前先对照检查实验矩阵覆盖、核算口径与数值等价证据的缺口，发现缺口就实际修改代码补齐。改进必须保持参考实现的数值语义不变，不得借改进之名做无意义的等价重写；不得削弱或删除 run_correctness.py / test_figures.py 中的对拍测试。每次改动后运行 python3 ci_gate.py 确认通过。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；LICENSE、README.md、ci_gate.py、conftest.py、run_correctness.py、test_figures.py 和 results_lm/ 目录同样绝对不能删除、修改或移动。'
          PROMPT_SCI_2='从实验设计与准备的角度改进这个项目的科研方法：检查基线矩阵——纯 KDA、纯 Mamba-2、纯 CSA、纯 HCA、稠密注意力与混合栈都要在参数量与 FLOPs 对齐的口径下比较（以 flops 审计核算），混合配比 3:1:1 的选择要有对照配比的证据支撑而不是默认值拍板。检查评估指标是否多维——PPL（按校准文档的口径与 bootstrap 区间）加检索质量探针加解码吞吐/TTFT/显存（按预算模型核算并显式标注参考实现口径），三个维度缺一不可：只报 loss 的混合架构研究没有说服力，只报速度又掩盖质量回归。检查假设驱动——八组实验矩阵的每组对应哪条主张（记忆容量、稀疏检索精度、全局上下文覆盖），带假设跑而不是排列组合配置字段。发现以上问题就实际修改代码与实验脚本来改进。改进必须保持参考实现的数值语义不变，不得借改进之名做无意义的等价重写；不得削弱或删除 run_correctness.py / test_figures.py 中的对拍测试。每次改动后运行 python3 ci_gate.py 确认通过。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；LICENSE、README.md、ci_gate.py、conftest.py、run_correctness.py、test_figures.py 和 results_lm/ 目录同样绝对不能删除、修改或移动。'
          PROMPT_SCI_3='从数据处理的角度改进这个项目的科研方法：检查评测口径一致性——不同算子与混合配比的 PPL 评测必须在完全相同的 token、窗口与语料上进行（以一致性检查核对），校准与区间按校准文档的口径，别让评测窗口差异伪装成架构差异。检查解码状态的数据完整性——跨 decode 步状态管理与分块预填充缓存在边界条件（空序列、极短序列、KV 预算耗尽、GQA/MQA 共享 KV）下的行为要可验证、有证书。检查量化与预算模拟的数据路径——量化模拟的输入分布与真实激活对齐，KV 预算模型的假设显式记录，别在与部署不符的假设下得出预算结论。发现以上问题就实际修改代码来改进。改进必须保持参考实现的数值语义不变，不得借改进之名做无意义的等价重写；不得削弱或删除 run_correctness.py / test_figures.py 中的对拍测试。每次改动后运行 python3 ci_gate.py 确认通过。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；LICENSE、README.md、ci_gate.py、conftest.py、run_correctness.py、test_figures.py 和 results_lm/ 目录同样绝对不能删除、修改或移动。'
          PROMPT_SCI_4='从可复现性与工程规范的角度改进这个项目的科研方法：检查对拍测试深度——run_correctness.py 的数值契约覆盖（因果性、dtype 边界、空序列、sink 稳定性、跨 decode 步状态）是本仓库的生命线：新增路径必须配对拍而不是只跑通；对拍只增不减。检查加速路径的数值等价——compiled_recurrent_kda、scripted_chunk_kda、分块滑窗等加速路径与朴素路径的数值等价按等价测试验证（缓存签名、TorchScript 回退路径），等价证据过期即失效。检查环境与种子——记录 GPU 与 torch 版本等环境快照，关键结论做多种子校准；同机同种子重跑稳定，跨硬件如实标注不保证逐位一致。发现以上问题就实际修改代码来改进。改进必须保持参考实现的数值语义不变，不得借改进之名做无意义的等价重写；不得削弱或删除 run_correctness.py / test_figures.py 中的对拍测试。每次改动后运行 python3 ci_gate.py 确认通过。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；LICENSE、README.md、ci_gate.py、conftest.py、run_correctness.py、test_figures.py 和 results_lm/ 目录同样绝对不能删除、修改或移动。'
          PROMPT_SCI_5='从对比实验与消融的角度改进这个项目的科研方法：检查受控变量——memory_type 在 KDA 与 Mamba-2 之间切换必须单配置字段完成、其余设置完全一致；混合配比消融（3:1:1 对照其他配比）与逐层分配搜索的搜索预算与协议要预声明，别让搜索深度差异伪装成架构差异。检查消融完整性——记忆算子（KDA/Mamba-2）、稀疏检索（CSA）、全局压缩（HCA）各自的贡献要能从矩阵分离：去一法与全因子都要有臂，缺臂就无法归因到组件。检查统计可靠性——关键结论多种子校准并报 Mean 与 Std；吞吐与延迟测量要隔离 kernel-launch 开销、重复多次报分布而不是单次计时，显存峰值要含 KV 与中间态。发现以上问题就实际修改实验代码来改进。改进必须保持参考实现的数值语义不变，不得借改进之名做无意义的等价重写；不得削弱或删除 run_correctness.py / test_figures.py 中的对拍测试。每次改动后运行 python3 ci_gate.py 确认通过。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；LICENSE、README.md、ci_gate.py、conftest.py、run_correctness.py、test_figures.py 和 results_lm/ 目录同样绝对不能删除、修改或移动。'
