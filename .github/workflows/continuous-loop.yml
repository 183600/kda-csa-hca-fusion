          pick_model() {
            if [ ${#FREE_MODELS[@]} -eq 0 ]; then
              build_model_pool || true
            fi
            local n=${#FREE_MODELS[@]}
            if [ "$n" -eq 0 ]; then
              CURRENT_MODEL=""
              return 1
            fi
            local m="" x
            if [ -n "$PREFERRED_MODEL" ] && ! is_broken "$PREFERRED_MODEL"; then
              for x in "${FREE_MODELS[@]}"; do
                if [ "$x" = "$PREFERRED_MODEL" ]; then m="$x"; break; fi
              done
            fi
            if [ -z "$m" ]; then
              # 随机挑一个「本次 run 内未判定失效」的模型（尽量不和上次相同）
              for _ in 1 2 3 4 5 6; do
                m="${FREE_MODELS[$((RANDOM % n))]}"
                is_broken "$m" && { m=""; continue; }
                if [ "$n" -le 1 ] || [ "$m" != "$PREVIOUS_MODEL" ]; then break; fi
              done
              # 随机撞上失效模型时退化为线性扫描，避免漏掉可用项
              if [ -z "$m" ]; then
                for x in "${FREE_MODELS[@]}"; do
                  if ! is_broken "$x"; then m="$x"; break; fi
                done
              fi
              if [ -z "$m" ]; then
                CURRENT_MODEL=""
                return 1
              fi
            fi
            PREVIOUS_MODEL="$m"
            CURRENT_MODEL="$m"
