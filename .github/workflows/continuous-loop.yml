              return 0
            fi
            # 备选：仓库工作区副本（私有仓库 raw 不可达时）
            if [ -f "$WF_PATH" ]; then
              cp "$WF_PATH" "$PRISTINE"
              return 0
            fi
            return 1
          }

          ensure_workflow() {
            [ -s "$PRISTINE" ] || return 0
            if [ ! -f "$WF_PATH" ] || ! cmp -s "$WF_PATH" "$PRISTINE"; then
