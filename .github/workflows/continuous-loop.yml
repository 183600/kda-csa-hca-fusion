              fi
            elif [ ! -f "$GATE_PATH" ]; then
              echo "[warn] ci_gate.py 缺失且无法获取固定版本"
            fi
          }

          gate_check() {
            ensure_gate
            echo "=========== GATE CHECK (syntax + pytest) ==========="
            python3 "$GATE_PATH"
            local EC=$?
            if [ $EC -eq 0 ]; then
              echo "[gate] PASS"
            else
              echo "[gate] FAIL (exit=$EC) —— 本阶段改动将被撤销"
            fi
            return $EC
          }

          reject_phase() {
            # 阶段内允许 agent 自己 git commit（防超时丢进度），
