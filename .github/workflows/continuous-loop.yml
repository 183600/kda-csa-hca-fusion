          # run 开始时在 detect_provider 里探测一次，选定 SELECTED_MODEL；之后所有阶段直接
          #   dsh --profile headless ...
          # 只有收到 429 / 5xx / 连接失败 / 其它非零退出时，才丢弃它并重新探测
