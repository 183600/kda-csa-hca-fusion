name: LLM Bug Check and Fix

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: llm-bug-fix
  cancel-in-progress: false

jobs:
  llm-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # 350min，留10min缓冲给 trigger-next
    continue-on-error: true        # 失败也不阻塞 trigger-next
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify opencode
        run: opencode --version

      - name: Configure opencode (NVIDIA NIM provider)
        run: |
          cat > opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "nvidia": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "https://integrate.api.nvidia.com/v1",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "z-ai/glm-5.2": {
                    "name": "GLM 5.2"
                  }
                }
              }
            },
            "model": "nvidia/z-ai/glm-5.2"
          }
          EOF
          grep -qxF '.opencode/' .gitignore 2>/dev/null || printf '\n.opencode/\n' >> .gitignore

      - name: Run opencode Cleanup & Bug-Fix Loop
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MAX_DURATION_SECONDS: "20400"  # 340min，留10min给清理+触发
          OPENCODE_MODEL: "nvidia/z-ai/glm-5.2"
        run: |
          python - <<'PYEOF'
          import os, time, subprocess

          MAX_DUR = int(os.environ["MAX_DURATION_SECONDS"])
          MODEL   = os.environ["OPENCODE_MODEL"]
          START   = time.time()

          # 清理 prompt：删除所有说明修复了什么 bug 的注释，以及文档里说明修复了什么 bug 的内容
          CLEANUP_PROMPT = (
              "扫描代码库中所有源代码文件与文档文件（包括 README、CHANGELOG、"
              "以及 .md / .ipynb / .py / .js / .ts 等所有文本文件），"
              "找出并删除所有说明「修复了什么 bug」「修了什么问题」「修正了什么错误」"
              "「修复了什么缺陷」之类内容的注释和文档段落（例如形如 "
              "'# 修复了 xxx 导致的崩溃'、'// fix: xxx'、'/* 修复了 xxx 问题 */'、"
              "'## Bug Fixes / 修复内容'、'- 修复了 xxx' 等都应删除）。"
              "删除这些说明性文字时不要改动实际的功能代码与实验逻辑，"
              "只移除描述 bug 修复历史的注释和文档内容。"
              "同样地，dyn_csa_experiment.ipynb 中的此类说明也要清理。"
              "请直接修改文件，不要保留任何关于 bug 修复历史的说明性内容。"
          )

          # 修复 prompt：原有的 bug 检查与修复
          REVIEW_PROMPT = (
              "不要读取.git目录，分析代码是否有影响实验结果的问题，如果有就修复，不要添加关于修复bug的说明，忽略关于已经修复的bug的注释，同时要读取2510.26692v2.txt和2606.19348v1.txt"
              "dyn_csa_experiment.ipynb是另一个实验的代码，"
              "dyn_csa_experiment.ipynb的问题也要修复"
          )

          # 两个 prompt 交替使用：奇数轮=CLEANUP，偶数轮=REVIEW
          # PROMPTS = [CLEANUP_PROMPT, REVIEW_PROMPT]
          # LABELS  = ["清理bug修复说明", "修复实验问题"]
          PROMPTS = [REVIEW_PROMPT, REVIEW_PROMPT]
          LABELS  = ["修复实验问题", "修复实验问题"]

          def run_cmd(cmd, timeout=120, **kw):
              """仅用于 git 命令，有超时保护；opencode 调用不使用此函数"""
              try:
                  return subprocess.run(cmd, capture_output=True, text=True,
                                        timeout=timeout, **kw)
              except subprocess.TimeoutExpired:
                  return subprocess.CompletedProcess(cmd, 124, "", "timeout")

          def git_setup():
              run_cmd(["git", "config", "user.name",  "github-actions[bot]"])
              run_cmd(["git", "config", "user.email", "github-actions@github.com"])

          def git_commit_push_all(msg):
              if os.path.exists("opencode.json"):
                  os.remove("opencode.json")
              if os.path.isdir(".opencode"):
                  run_cmd(["rm", "-rf", ".opencode"])
              # 保护工作流文件，防止 opencode 修改后破坏循环
              run_cmd(["git", "checkout", "--", ".github/workflows/"])
              run_cmd(["git", "add", "-A"])
              r = run_cmd(["git", "commit", "-m", msg])
              if r.returncode != 0:
                  return False
              for _ in range(3):
                  pr = run_cmd(["git", "push"], timeout=60)
                  if pr.returncode == 0:
                      return True
                  run_cmd(["git", "pull", "--rebase", "origin",
                           os.environ.get("GITHUB_REF_NAME", "HEAD")], timeout=60)
                  time.sleep(3)
              return False

          def call_opencode(prompt):
              """单次 opencode 调用——无 timeout，仅受 GitHub job 总时间限制约束"""
              print(f"  -> Prompt 大小: {len(prompt.encode('utf-8')):,} 字节")
              return subprocess.run(
                  ["opencode", "run", "--model", MODEL],
                  input=prompt,
                  capture_output=True, text=True,
                  env=os.environ.copy(),
              )

          git_setup()

          iteration = 0
          while True:
              elapsed = time.time() - START
              remaining = MAX_DUR - elapsed
              # 留10分钟缓冲，确保有足够时间做最终提交+触发下一次
              if remaining <= 2000:
                  print(f"\n ({remaining:.0f}s)，停止迭代。")
                  break

              iteration += 1
              # 交替选择 prompt：奇数轮=CLEANUP，偶数轮=REVIEW
              phase_idx = (iteration - 1) % 2
              user_msg  = PROMPTS[phase_idx]
              phase_lbl = LABELS[phase_idx]

              print(f"\n=========== 第 {iteration} 次迭代 [{phase_lbl}] "
                    f"(已耗时 {elapsed:.0f}s, 剩余 {remaining:.0f}s) ===========")

              try:
                  r = call_opencode(user_msg)
              except Exception as e:
                  print(f"  opencode 错误: {e}")
                  time.sleep(30)
                  continue

              if r.returncode != 0:
                  print(f"  -> opencode 退出码 {r.returncode}")
                  if r.stderr:
                      print("     stderr:", r.stderr[:500])
                  run_cmd(["git", "checkout", "--", "."])
                  continue

              if r.stdout:
                  lines   = r.stdout.splitlines()
                  preview = "\n     ".join(lines[-20:])
                  print(f"  -> opencode 输出 (最后 20 行):\n     {preview}")

              commit_msg = (
                  f"opencode: {phase_lbl} "
                  f"(第 {iteration} 次迭代)"
              )
              if git_commit_push_all(commit_msg):
                  print("  -> 已提交并推送")
              else:
                  print("  -> 提交/推送失败；将继续处理。")

          print("完成。")
          PYEOF

  # ==========================================
  # 自触发 Job — 无论 llm-fix 成功/失败/超时/取消都会执行
  # ==========================================
  trigger-next:
    needs: llm-fix
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    steps:
      - name: Trigger next workflow run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: |
          echo "上一个任务的状态: ${{ needs.llm-fix.result }}"
          echo "等待 10 秒进行清理..."
          sleep 10

          WF_ID=$(gh api "/repos/$REPO/actions/workflows" \
            --jq ".workflows[] | select(.name == \"$WORKFLOW_NAME\") | .id")

          if [ -z "$WF_ID" ]; then
            echo "❌ 找不到 '$WORKFLOW_NAME' 的工作流 ID。循环将在此停止。"
            exit 1
          fi

          echo "找到工作流 ID: $WF_ID"

          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "尝试触发下一次运行 (第 $i/$MAX_RETRIES 次)..."

            if gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/actions/workflows/$WF_ID/dispatches" \
              -f "ref=$WORKFLOW_REF"; then
              echo "✅ 成功触发 '$WORKFLOW_NAME' 在分支 '$WORKFLOW_REF' 上的下一次运行"
              sleep 5
              echo "最近的工作流运行记录:"
              gh run list --workflow "$WORKFLOW_NAME" --limit 3
              exit 0
            else
              echo "⚠️ 第 $i 次触发失败，等待 15 秒后重试..."
              sleep 15
            fi
          done

          echo "❌ 触发下一次运行失败（已重试 $MAX_RETRIES 次）。"
          exit 1